[project]
name = "receipt-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "dynaconf (>=3.2.12,<4.0.0)",
    "google-genai (>=1.49.0,<2.0.0)",
    "chromadb (>=1.3.4,<2.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "zipp (>=3.23.0,<4.0.0)",
    "onnxruntime (==1.23.2)",
    "mysql-connector-python (==8.0.29)",
    "pandas (>=2.3.3,<3.0.0)",
    "ipykernel (==6.31.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tokenizers (==0.21)",
    "optimum-onnx[onnxruntime] (>=0.0.3,<0.0.4)",
    "fastapi (>=0.121.1,<0.122.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "docling (>=2.61.2,<3.0.0)",
]

[tool.poetry]
packages = [{include = "receipt_ai", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
